site_name: WaveXisMCP
site_description: MCP server exposing the wavexis browser automation library to LLMs — 220 tools, 13 capability tiers, zero Node.js
site_url: https://mathiaspaulenko.github.io/wavexis-mcp/
repo_url: https://github.com/MathiasPaulenko/wavexis-mcp
repo_name: MathiasPaulenko/wavexis-mcp
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/logo-white.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MathiasPaulenko/wavexis-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/wavexis-mcp/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Configuration: configuration.md
  - Guide:
      - Architecture: architecture.md
      - Capability Tiers: capability-tiers.md
      - HTTP Transport: http-transport.md
      - Docker: docker.md
      - Stealth Mode: stealth-mode.md
      - Resources & Prompts: resources-prompts.md
      - Rate Limiting: rate-limiting.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
      - Benchmarks: benchmarks.md
  - Tools:
      - Core: tools/core.md
      - Network: tools/network.md
      - Storage: tools/storage.md
      - Emulation: tools/emulation.md
      - A11y: tools/a11y.md
      - Interactions: tools/interactions.md
      - DevTools: tools/devtools.md
      - Vision: tools/vision.md
      - Video: tools/video.md
      - Testing: tools/testing.md
      - Workflows: tools/workflows.md
      - Data: tools/data.md
      - Experimental: tools/experimental.md
  - Cookbook:
      - Screenshot: examples/screenshot.md
      - Scrape: examples/scrape.md
      - Testing: examples/testing.md
      - Visual Regression: examples/visual-regression.md
      - Multi-Action: examples/multi-action.md
      - Tutorials: tutorials.md
  - API Reference:
      - Python API: api/python.md
  - Development:
      - Contributing: contributing.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
