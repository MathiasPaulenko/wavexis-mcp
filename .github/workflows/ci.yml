name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check wavexis_mcp tests

      - name: Ruff format check
        run: ruff format --check

      - name: Mypy
        run: mypy wavexis_mcp

      - name: Bandit security check
        run: python -m bandit -r wavexis_mcp

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Build documentation
        run: NO_MKDOCS_2_WARNING=1 python -m mkdocs build -q

      - name: Unit tests
        run: pytest tests/unit -v --cov=wavexis_mcp --cov-report=xml --cov-fail-under=90

      - name: Integration tests
        run: pytest tests/integration -v -m integration

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: E2E tests
        env:
          WAVEXIS_MCP_ALLOW_INTERNAL_URLS: "1"
          WAVEXIS_MCP_ALLOW_RAW_COMMANDS: "all"
        run: pytest tests/e2e -v -m e2e --timeout=120

