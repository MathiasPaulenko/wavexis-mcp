services:
  wavexis-mcp:
    build: .
    restart: unless-stopped
    command: ["--transport=http", "--allow-remote", "--port=8765", "--caps=all"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - CDPWAVE_BROWSER_PATH=/usr/bin/chromium
      - WAVEXIS_MCP_OUTPUT_DIR=/home/wavexis/output
      - CI=true
    volumes:
      - ./output:/home/wavexis/output
