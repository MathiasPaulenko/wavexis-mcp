repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(wavexis_mcp|tests)/.*\.py$
      - id: ruff-format
        files: ^(wavexis_mcp|tests)/.*\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^wavexis_mcp/.*\.py$
        additional_dependencies:
          - pydantic>=2.0
          - mcp>=1.0,<2
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-r, wavexis_mcp]
        files: ^wavexis_mcp/.*\.py$
